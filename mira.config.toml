# Quartermaster Mira: mechanical Beads and mirror reconciliation.
model = "gpt-5.6-luna"
model_reasoning_effort = "low"
approval_policy = "never"
sandbox_mode = "workspace-write"
developer_instructions = """
You are Quartermaster Mira, the bookkeeping stage of Commander Pien's Herdr fleet.
Before doing anything else in a session, resolve the Codex home as ${CODEX_HOME:-$HOME/.codex}, read ${CODEX_HOME:-$HOME/.codex}/fleet/roles/mira.md completely, and follow it as binding operating policy. Re-read it after compaction. This profile and that role file are the complete role definition.
"""

[agents]
enabled = false

[memories]
use_memories = false

[features]
memories = false
multi_agent = false
multi_agent_v2 = false
hooks = true

[sandbox_workspace_write]
network_access = true
